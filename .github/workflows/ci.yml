name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check --output-format=github .
      - run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-fail-under=95
      - name: Smoke test the installed command
        run: log-analyzer samples/auth.log --output report.json

  test-postgres:
    name: API tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LOG_ANALYZER_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,postgres]"
      - run: pytest tests/api

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker build -t log-analyzer:ci .
      - name: Start the container
        run: docker run -d --name api -p 8000:8000 log-analyzer:ci
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
      - name: Analyze a sample log
        run: |
          id=$(curl -sf -F file=@samples/auth.log http://localhost:8000/analyses | jq -r .id)
          for i in $(seq 1 10); do
            status=$(curl -sf "http://localhost:8000/analyses/$id" | jq -r .status)
            [ "$status" = completed ] && exit 0
            sleep 1
          done
          echo "analysis status: $status"
          docker logs api
          exit 1
