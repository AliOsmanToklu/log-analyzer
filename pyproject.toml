[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analyzer"
dynamic = ["version"]
description = "Detect brute force and scanning activity in SSH and Windows logon logs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ali Osman Toklu" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["security", "log-analysis", "ssh", "brute-force", "windows-events"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]

[project.optional-dependencies]
# The CLI needs nothing beyond the standard library; the web API is opt-in
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "log-analyzer[api]",
    "httpx2>=2.0",  # used by starlette.testclient
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]

[project.urls]
Repository = "https://github.com/AliOsmanToklu/log-analyzer"

[project.scripts]
log-analyzer = "log_analyzer.cli:main"
log-analyzer-api = "log_analyzer.api.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "log_analyzer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
log_analyzer = ["py.typed", "api/migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["log_analyzer"]
branch = true
omit = ["*/log_analyzer/__main__.py", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
