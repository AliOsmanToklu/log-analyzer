[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analyzer"
dynamic = ["version"]
description = "Detect brute force and scanning activity in SSH and Windows logon logs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ali Osman Toklu" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["security", "log-analysis", "ssh", "brute-force", "windows-events"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Repository = "https://github.com/AliOsmanToklu/log-analyzer"

[project.scripts]
log-analyzer = "log_analyzer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "log_analyzer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
log_analyzer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["log_analyzer"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
